<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2A9D8F">
    <title>Food Agenda</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

        :root {
            --primary: #2A9D8F;
            --primary-dark: #1F7A6E;
            --primary-light: #E8F5F2;
            --bg: #F0F4F8;
            --card: #FFFFFF;
            --text: #1F2937;
            --text-secondary: #6B7280;
            --border: #E5E7EB;
            --success: #10B981;
            --success-bg: #ECFDF5;
            --warning: #F59E0B;
            --warning-bg: #FFFBEB;
            --danger: #EF4444;
            --danger-bg: #FEF2F2;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --radius: 16px;
        }

        .dark {
            --bg: #111827;
            --card: #1F2937;
            --text: #F9FAFB;
            --text-secondary: #9CA3AF;
            --border: #374151;
            --primary-light: #1A3A35;
            --shadow: 0 2px 12px rgba(0,0,0,0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
            transition: background 0.3s, color 0.3s;
        }

        /* ===== PAGES ===== */
        .page {
            display: none;
            padding: 20px 16px;
            max-width: 500px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== HEADER ===== */
        .top-header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white;
            padding: 24px 20px;
            border-radius: 0 0 24px 24px;
            margin: -20px -16px 20px;
            text-align: center;
        }

        .top-header h1 {
            font-size: 26px;
            font-weight: 900;
        }

        .top-header p {
            font-size: 14px;
            opacity: 0.85;
            margin-top: 4px;
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== INPUTS ===== */
        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            background: var(--card);
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--primary);
        }

        .input-field::placeholder {
            color: var(--text-secondary);
            font-weight: 400;
        }

        textarea.input-field {
            min-height: 80px;
            resize: vertical;
            line-height: 1.6;
        }

        /* ===== BUTTONS ===== */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-family: 'Cairo', sans-serif;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(42, 157, 143, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #F59E0B, #D97706);
            color: white;
        }

        .btn-outline {
            background: var(--card);
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-small {
            padding: 10px 16px;
            font-size: 14px;
            width: auto;
            margin-bottom: 0;
        }

        /* ===== MEAL CARD ===== */
        .meal-card {
            background: var(--card);
            border-radius: var(--radius);
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .meal-header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .meal-header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .meal-icon {
            font-size: 28px;
        }

        .meal-name {
            font-size: 18px;
            font-weight: 800;
        }

        .meal-status {
            font-size: 13px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .status-done {
            background: var(--success-bg);
            color: var(--success);
        }

        .status-pending {
            background: var(--warning-bg);
            color: var(--warning);
        }

        .meal-body {
            padding: 0 18px 18px;
            display: none;
        }

        .meal-body.open {
            display: block;
        }

        .time-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .time-input-row label {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
        }

        .time-input {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 17px;
            font-weight: 700;
            text-align: center;
            color: var(--text);
            background: var(--card);
            outline: none;
        }

        .time-input:focus {
            border-color: var(--primary);
        }

        /* ===== WATER TRACKER ===== */
        .water-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .water-cup {
            aspect-ratio: 1;
            border: 2px solid #93C5FD;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--card);
        }

        .water-cup.filled {
            background: #DBEAFE;
            border-color: #3B82F6;
        }

        .dark .water-cup.filled {
            background: #1E3A5F;
        }

        /* ===== MOOD SELECTOR ===== */
        .mood-grid {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }

        .mood-btn {
            font-size: 36px;
            background: none;
            border: 3px solid transparent;
            border-radius: 50%;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.4;
        }

        .mood-btn.selected {
            opacity: 1;
            border-color: var(--primary);
            background: var(--primary-light);
            transform: scale(1.15);
        }

        /* ===== WEEKLY SUMMARY ===== */
        .day-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }

        .day-summary:last-child {
            border-bottom: none;
        }

        .day-summary-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .day-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .day-name-text {
            font-size: 17px;
            font-weight: 700;
        }

        .day-meals-count {
            font-size: 15px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 16px;
            background: var(--border);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .progress-text {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            margin-top: 8px;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            padding-bottom: max(8px, env(safe-area-inset-bottom));
            z-index: 1000;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 12px;
            border: none;
            background: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-family: 'Cairo', sans-serif;
            font-size: 12px;
            font-weight: 700;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item .nav-icon {
            font-size: 24px;
        }

        /* ===== THEME TOGGLE ===== */
        .theme-toggle {
            position: fixed;
            top: 12px;
            left: 12px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--card);
            border: 1px solid var(--border);
            font-size: 20px;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--success);
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            z-index: 9999;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ===== DATE NAV ===== */
        .date-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .date-nav-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--card);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        .date-display {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
        }

        /* ===== WHATSAPP CONFIG ===== */
        .config-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .config-row label {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
        }

        .config-row input {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            color: var(--text);
            background: var(--card);
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Theme Toggle -->
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- ==================== PAGE 1: HOME ==================== -->
    <div class="page active" id="page-home">
        <div class="top-header">
            <h1>🥗 Food Agenda</h1>
            <p>سجّل أكلك يومياً وتابع صحتك</p>
        </div>

        <div class="card">
            <div class="card-title">👤 بياناتك</div>
            <div class="input-group">
                <label>اسمك</label>
                <input type="text" class="input-field" id="patientName" placeholder="اكتب اسمك هنا...">
            </div>
            <div class="input-group">
                <label>رقم أسبوع المتابعة</label>
                <input type="text" class="input-field" id="weekNum" placeholder="مثال: 1">
            </div>
        </div>

        <div class="card">
            <div class="card-title">⚙️ إعدادات الإرسال</div>
            <div class="config-row">
                <label>📱 واتساب الدكتور:</label>
                <input type="tel" class="input-field" id="doctorPhone" placeholder="201012345678" style="font-size:15px; padding:10px;">
            </div>
            <p style="font-size:13px; color:var(--text-secondary); margin-top:4px;">
                اكتب رقم الواتساب بالكود الدولي بدون + أو مسافات
            </p>
        </div>

        <button class="btn btn-primary" onclick="goToPage('daily')">
            ▶️ ابدأ تسجيل اليوم
        </button>

        <button class="btn btn-outline" onclick="goToPage('weekly')">
            📅 عرض ملخص الأسبوع
        </button>
    </div>

    <!-- ==================== PAGE 2: DAILY LOG ==================== -->
    <div class="page" id="page-daily">
        <div class="top-header">
            <h1>📝 تسجيل اليوم</h1>
            <p id="todayDate"></p>
        </div>

        <div class="date-nav">
            <button class="date-nav-btn" onclick="changeDay(-1)">→</button>
            <span class="date-display" id="dateDisplay"></span>
            <button class="date-nav-btn" onclick="changeDay(1)">←</button>
        </div>

        <div id="mealsContainer"></div>

        <!-- Water -->
        <div class="card">
            <div class="card-title">💧 شرب الماء</div>
            <p style="font-size:15px; color:var(--text-secondary); margin-bottom:8px;">اضغط على كل كوب تشربه</p>
            <div class="water-grid" id="waterGrid"></div>
        </div>

        <!-- Mood -->
        <div class="card">
            <div class="card-title">😊 إزاي حاسس النهاردة؟</div>
            <div class="mood-grid" id="moodGrid">
                <button class="mood-btn" onclick="selectMood(this, '😞')">😞</button>
                <button class="mood-btn" onclick="selectMood(this, '😐')">😐</button>
                <button class="mood-btn" onclick="selectMood(this, '🙂')">🙂</button>
                <button class="mood-btn" onclick="selectMood(this, '😊')">😊</button>
                <button class="mood-btn" onclick="selectMood(this, '🤩')">🤩</button>
            </div>
        </div>

        <!-- Notes -->
        <div class="card">
            <div class="card-title">📝 ملاحظات</div>
            <textarea class="input-field" id="dayNotes" placeholder="أي ملاحظات عن يومك... (جوع، تعب، رياضة...)"></textarea>
        </div>

        <button class="btn btn-success" onclick="saveDay()">
            ✅ حفظ تسجيل اليوم
        </button>
    </div>

    <!-- ==================== PAGE 3: WEEKLY SUMMARY ==================== -->
    <div class="page" id="page-weekly">
        <div class="top-header">
            <h1>📊 ملخص الأسبوع</h1>
            <p id="weeklyPatientName"></p>
        </div>

        <div class="card">
            <div class="card-title">📈 نسبة الالتزام</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width:0%; background: var(--success);"></div>
            </div>
            <div class="progress-text" id="progressText" style="color: var(--success);">0%</div>
        </div>

        <div class="card">
            <div class="card-title">📅 تفاصيل الأيام</div>
            <div id="weeklyDetails"></div>
        </div>

        <button class="btn btn-primary" onclick="sendWhatsApp()">
            📲 إرسال التقرير للدكتور على واتساب
        </button>

        <button class="btn btn-outline" onclick="window.print()">
            📥 حفظ كـ PDF
        </button>

        <button class="btn btn-warning" onclick="clearWeekData()">
            🗑️ مسح بيانات الأسبوع
        </button>
    </div>

    <!-- ==================== BOTTOM NAV ==================== -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="goToPage('home')" id="nav-home">
            <span class="nav-icon">🏠</span>
            الرئيسية
        </button>
        <button class="nav-item" onclick="goToPage('daily')" id="nav-daily">
            <span class="nav-icon">📝</span>
            تسجيل اليوم
        </button>
        <button class="nav-item" onclick="goToPage('weekly')" id="nav-weekly">
            <span class="nav-icon">📊</span>
            الملخص
        </button>
    </nav>

    <script>
        // ===== DATA =====
        const MEALS = [
            { id: 'breakfast', name: 'الإفطار', icon: '🌅', color: '#F59E0B' },
            { id: 'snack1', name: 'سناك صباحي', icon: '🍎', color: '#EF4444' },
            { id: 'lunch', name: 'الغداء', icon: '☀️', color: '#10B981' },
            { id: 'snack2', name: 'سناك مسائي', icon: '☕', color: '#8B5CF6' },
            { id: 'dinner', name: 'العشاء', icon: '🌙', color: '#3B82F6' }
        ];

        const DAY_NAMES = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        const DAY_COLORS = ['#3478B9', '#DB7A22', '#8251A4', '#D05B3D', '#198A80', '#C94E78', '#3F8F52'];

        let currentDate = new Date();

        // ===== NAVIGATION =====
        function goToPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById('page-' + page).classList.add('active');
            document.getElementById('nav-' + page).classList.add('active');

            if (page === 'daily') initDailyPage();
            if (page === 'weekly') initWeeklyPage();

            window.scrollTo(0, 0);
        }

        // ===== THEME =====
        function toggleTheme() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function loadTheme() {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark');
                document.getElementById('themeBtn').textContent = '☀️';
            }
        }

        // ===== TOAST =====
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ===== DATE HELPERS =====
        function getDateKey(date) {
            return date.toISOString().split('T')[0];
        }

        function formatDate(date) {
            const d = date.getDate();
            const m = date.getMonth() + 1;
            const dayName = DAY_NAMES[date.getDay()];
            return `${dayName} ${d}/${m}`;
        }

        function changeDay(offset) {
            currentDate.setDate(currentDate.getDate() + offset);
            initDailyPage();
        }

        // ===== DAILY PAGE =====
        function initDailyPage() {
            const name = document.getElementById('patientName').value || 'ضيف';
            document.getElementById('todayDate').textContent = `👤 ${name}`;
            document.getElementById('dateDisplay').textContent = formatDate(currentDate);

            const dateKey = getDateKey(currentDate);
            const dayData = getDayData(dateKey);

            // Build meals
            const container = document.getElementById('mealsContainer');
            container.innerHTML = '';

            MEALS.forEach(meal => {
                const mealData = dayData.meals[meal.id] || {};
                const hasData = mealData.time || mealData.food;
                const statusClass = hasData ? 'status-done' : 'status-pending';
                const statusText = hasData ? '✅ تم' : '⏳ لم يُسجل';

                container.innerHTML += `
                    <div class="meal-card">
                        <div class="meal-header" onclick="toggleMeal('${meal.id}')">
                            <div class="meal-header-right">
                                <span class="meal-icon">${meal.icon}</span>
                                <span class="meal-name">${meal.name}</span>
                            </div>
                            <span class="meal-status ${statusClass}" id="status-${meal.id}">${statusText}</span>
                        </div>
                        <div class="meal-body" id="body-${meal.id}">
                            <div class="time-input-row">
                                <label>⏰ وقت الأكل:</label>
                                <input type="time" class="time-input" id="time-${meal.id}" value="${mealData.time || ''}">
                            </div>
                            <div class="input-group">
                                <label>🍽️ ماذا أكلت؟</label>
                                <textarea class="input-field" id="food-${meal.id}" placeholder="اكتب كل اللي أكلته في الوجبة دي...">${mealData.food || ''}</textarea>
                            </div>
                            <button class="btn btn-success btn-small" onclick="saveMeal('${meal.id}')">
                                ✅ حفظ الوجبة
                            </button>
                        </div>
                    </div>
                `;
            });

            // Water
            const waterGrid = document.getElementById('waterGrid');
            waterGrid.innerHTML = '';
            for (let i = 1; i <= 8; i++) {
                const filled = (dayData.water || 0) >= i;
                waterGrid.innerHTML += `
                    <div class="water-cup ${filled ? 'filled' : ''}" onclick="setWater(${i})">
                        ${filled ? '💧' : '○'}
                    </div>
                `;
            }

            // Mood
            document.querySelectorAll('.mood-btn').forEach(btn => {
                btn.classList.toggle('selected', btn.textContent.trim() === dayData.mood);
            });

            // Notes
            document.getElementById('dayNotes').value = dayData.notes || '';
        }

        function toggleMeal(id) {
            const body = document.getElementById('body-' + id);
            body.classList.toggle('open');
        }

        function saveMeal(id) {
            const dateKey = getDateKey(currentDate);
            const dayData = getDayData(dateKey);

            dayData.meals[id] = {
                time: document.getElementById('time-' + id).value,
                food: document.getElementById('food-' + id).value
            };

            saveDayData(dateKey, dayData);

            const status = document.getElementById('status-' + id);
            status.className = 'meal-status status-done';
            status.textContent = '✅ تم';

            showToast('✅ تم حفظ الوجبة');
        }

        function setWater(count) {
            const dateKey = getDateKey(currentDate);
            const dayData = getDayData(dateKey);
            dayData.water = count;
            saveDayData(dateKey, dayData);
            initDailyPage();
        }

        function selectMood(btn, mood) {
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');

            const dateKey = getDateKey(currentDate);
            const dayData = getDayData(dateKey);
            dayData.mood = mood;
            saveDayData(dateKey, dayData);
        }

        function saveDay() {
            const dateKey = getDateKey(currentDate);
            const dayData = getDayData(dateKey);
            dayData.notes = document.getElementById('dayNotes').value;
            saveDayData(dateKey, dayData);
            showToast('✅ تم حفظ تسجيل اليوم بنجاح!');
        }

        // ===== WEEKLY PAGE =====
        function initWeeklyPage() {
            const name = document.getElementById('patientName').value || 'ضيف';
            document.getElementById('weeklyPatientName').textContent = `👤 ${name} — الأسبوع رقم ${document.getElementById('weekNum').value || '1'}`;

            const details = document.getElementById('weeklyDetails');
            details.innerHTML = '';

            let totalMeals = 0;
            const maxMeals = 7 * 5;

            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateKey = getDateKey(d);
                const dayData = getDayData(dateKey);
                const dayName = DAY_NAMES[d.getDay()];
                const colorIndex = d.getDay();

                let mealCount = 0;
                MEALS.forEach(m => {
                    if (dayData.meals[m.id] && (dayData.meals[m.id].time || dayData.meals[m.id].food)) {
                        mealCount++;
                    }
                });

                totalMeals += mealCount;

                let countClass, countBg;
                if (mealCount >= 4) { countClass = 'var(--success)'; countBg = 'var(--success-bg)'; }
                else if (mealCount >= 2) { countClass = 'var(--warning)'; countBg = 'var(--warning-bg)'; }
                else { countClass = 'var(--danger)'; countBg = 'var(--danger-bg)'; }

                details.innerHTML += `
                    <div class="day-summary">
                        <div class="day-summary-right">
                            <div class="day-dot" style="background:${DAY_COLORS[colorIndex]}"></div>
                            <span class="day-name-text">${dayName} ${d.getDate()}/${d.getMonth()+1}</span>
                            <span style="font-size:18px">${dayData.mood || ''}</span>
                        </div>
                        <span class="day-meals-count" style="color:${countClass}; background:${countBg}">
                            ${mealCount}/5 وجبات
                        </span>
                    </div>
                `;
            }

            const percent = Math.round((totalMeals / maxMeals) * 100);
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = percent + '%';

            if (percent >= 70) {
                document.getElementById('progressFill').style.background = 'var(--success)';
                document.getElementById('progressText').style.color = 'var(--success)';
            } else if (percent >= 40) {
                document.getElementById('progressFill').style.background = 'var(--warning)';
                document.getElementById('progressText').style.color = 'var(--warning)';
            } else {
                document.getElementById('progressFill').style.background = 'var(--danger)';
                document.getElementById('progressText').style.color = 'var(--danger)';
            }
        }

        // ===== WHATSAPP =====
        function sendWhatsApp() {
            const phone = document.getElementById('doctorPhone').value.trim();
            const name = document.getElementById('patientName').value.trim() || 'مريض';
            const week = document.getElementById('weekNum').value || '1';

            if (!phone) {
                showToast('⚠️ اكتب رقم واتساب الدكتور في الإعدادات');
                goToPage('home');
                return;
            }

            let msg = `📋 *تقرير المتابعة الأسبوعي*\n`;
            msg += `👤 الاسم: ${name}\n`;
            msg += `📅 الأسبوع رقم: ${week}\n`;
            msg += `━━━━━━━━━━━━━━━\n\n`;

            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateKey = getDateKey(d);
                const dayData = getDayData(dateKey);
                const dayName = DAY_NAMES[d.getDay()];

                let hasMeals = false;
                let dayMsg = `*${dayName} ${d.getDate()}/${d.getMonth()+1}* ${dayData.mood || ''}\n`;

                MEALS.forEach(m => {
                    const meal = dayData.meals[m.id];
                    if (meal && (meal.time || meal.food)) {
                        hasMeals = true;
                        dayMsg += `${m.icon} ${m.name}: ${meal.time || '—'} | ${meal.food || '—'}\n`;
                    }
                });

                if (dayData.water) dayMsg += `💧 ماء: ${dayData.water}/8\n`;
                if (dayData.notes) dayMsg += `📝 ${dayData.notes}\n`;

                if (hasMeals) msg += dayMsg + `\n`;
            }

            const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }

        // ===== STORAGE =====
        function getAllData() {
            return JSON.parse(localStorage.getItem('foodAgendaData') || '{}');
        }

        function getDayData(dateKey) {
            const all = getAllData();
            return all[dateKey] || { meals: {}, water: 0, mood: '', notes: '' };
        }

        function saveDayData(dateKey, data) {
            const all = getAllData();
            all[dateKey] = data;
            localStorage.setItem('foodAgendaData', JSON.stringify(all));
        }

        function clearWeekData() {
            if (!confirm('هل أنت متأكد من مسح بيانات الأسبوع؟')) return;
            const all = getAllData();
            for (let i = 0; i < 7; i++) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                delete all[getDateKey(d)];
            }
            localStorage.setItem('foodAgendaData', JSON.stringify(all));
            initWeeklyPage();
            showToast('🗑️ تم مسح البيانات');
        }

        // ===== LOAD SETTINGS =====
        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('foodAgendaSettings') || '{}');
            if (settings.name) document.getElementById('patientName').value = settings.name;
            if (settings.week) document.getElementById('weekNum').value = settings.week;
            if (settings.phone) document.getElementById('doctorPhone').value = settings.phone;
        }

        function saveSettings() {
            const settings = {
                name: document.getElementById('patientName').value,
                week: document.getElementById('weekNum').value,
                phone: document.getElementById('doctorPhone').value
            };
            localStorage.setItem('foodAgendaSettings', JSON.stringify(settings));
        }

        document.getElementById('patientName').addEventListener('input', saveSettings);
        document.getElementById('weekNum').addEventListener('input', saveSettings);
        document.getElementById('doctorPhone').addEventListener('input', saveSettings);

        // ===== INIT =====
        loadTheme();
        loadSettings();
    </script>
</body>
</html>
